<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>知己 · 同尺寸对照</title><style>body{font:16px/1.65 system-ui;margin:3vw;color:#252925}section{display:grid;grid-template-columns:1fr 1fr;gap:12px}img{width:100%;border:1px solid #ddd}figure{margin:0}a{color:inherit}@media(max-width:700px){section{grid-template-columns:1fr}}</style><h1>知识库与笔记详情</h1><p>两版使用同一组示例笔记。点击截图可查看原始尺寸。</p><main></main><script>const main=document.querySelector('main'); for(const [w,h] of [[1440,900],[1280,800],[768,1024],[390,844]]){const title=document.createElement('h2');title.textContent=w+' × '+h;main.append(title);const group=document.createElement('section');main.append(group);for(const kind of w>=1280?['old','new']:['new']){const img=kind+'-'+w+'.png';group.innerHTML+='<figure><figcaption>'+(kind==='old'?'当前正式布局':'设计原型')+'</figcaption><a href="'+img+'"><img src="'+img+'" alt="知识库阅读界面"></a></figure>'}}</script></html>
